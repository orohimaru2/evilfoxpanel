# Dokploy → Compose. Публичный адрес панели: https://<сервер>:10000
# Caddy сам выпускает сертификат. Домен во вкладке Domains не нужен:
# Traefik говорит с контейнером по HTTP и сломает уже включённый TLS.
# container_name намеренно нет — иначе Dokploy теряет логи и метрики.
# В файрволе открой TCP 10000.

services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - evilfox
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    depends_on:
      panel:
        condition: service_healthy
    ports:
      - "10000:10000"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - evilfox
      - dokploy-network

networks:
  evilfox:
  dokploy-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
