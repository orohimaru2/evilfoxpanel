# Файл для Dokploy → Compose.
# Домен лучше задать во вкладке Domains: сервис panel, порт контейнера 80.
# Сеть dokploy-network нужна, чтобы Traefik Dokploy увидел контейнер.
# container_name намеренно нет — иначе Dokploy теряет логи и метрики.

services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  dokploy-network:
    external: true
