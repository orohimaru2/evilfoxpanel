# Dokploy → Compose. Публичный адрес: https://<домен>:10000
# Let's Encrypt проверяет домен по порту 80. Этот порт должен достаться Caddy.
# Если 80 уже занят Traefik Dokploy, выпуск сертификата не состоится.
# Домен во вкладке Domains не добавляй: Traefik ходит в контейнер по HTTP
# и ломает TLS, который завершает Caddy.
# container_name намеренно нет — иначе Dokploy теряет логи и метрики.

services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - evilfox
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    depends_on:
      panel:
        condition: service_healthy
    environment:
      TLS_MODE: ${TLS_MODE:-letsencrypt}
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "10000:10000"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - evilfox
      - dokploy-network

networks:
  evilfox:
  dokploy-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
