# Локально без домена: TLS_MODE=internal, панель https://localhost:10000
# Сервер с доменом: TLS_MODE=letsencrypt в .env, панель https://домен:10000
# Порт 80 нужен Let's Encrypt для проверки домена. Сама панель слушает 10000.

services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - evilfox
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    depends_on:
      panel:
        condition: service_healthy
    environment:
      TLS_MODE: ${TLS_MODE:-internal}
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "10000:10000"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - evilfox

networks:
  evilfox:

volumes:
  caddy_data:
  caddy_config:
